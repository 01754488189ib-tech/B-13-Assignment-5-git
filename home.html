<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-13 A-5</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        
</head>

<body class="bg-gray-100">
    <header>
        <div class="navbar bg-base-100 shadow-sm">
            <div class="flex-1">
                <a class="btn btn-ghost text-3xl"><i class="fa-brands fa-github text-5xl"></i>GitHub Issues Tracker</a>
            </div>
            <div class="join gap-3">
                <div class="flex items-center justify-center">
                    <label class="input validator join-item rounded-lg">
                        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                stroke="currentColor">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>
                        <input type="text" placeholder="Search issues..." required />
                    </label>
                </div>
                <button class="btn btn-outline btn-primary join-item rounded-lg"><i class="fa-solid fa-plus"></i> New
                    Issue</button>
            </div>

        </div>
    </header>

    <section class="pt-10">
        <div id="filter-container" class=" gap-4 p-5 mx-auto w-11/12 bg-white rounded-md shadow-sm">

            <button id="tab-all" onclick="filterTap('all')" class="btn btn-outline btn-primary px-7">All<i
                    class="fa-solid fa-desktop"></i>
            </button>

            <button id="tab-Open" onclick="filterTap('Open')" class="btn btn-outline btn-primary px-5">Open<i
                    class="fa-solid fa-door-open"></i>
            </button>

            <button id="tab-Closed" onclick="filterTap('Closed')" class="btn btn-outline btn-primary">Closed<i
                    class="fa-solid fa-door-closed"></i>
            </button>

        </div>
    </section>

    <section class="pt-8">
        <div class="gap-10 p-5 mx-auto w-11/12 bg-white rounded-md shadow-sm justify-between relative">
            <div class="flex space-x-5">
                <div class=" bg-[#ECE4FF] w-16 h-16 flex items-center justify-center rounded-full">
                    <img src="./assets/Aperture.png" alt="Aperture" class="w-[70%]">
                </div>
                <div class="">
                    <h2 class="text-2xl font-medium"><span id="totalStatus" class="font-bold text-4xl text-primary">50</span> Issues</h2>
                    <p class="font-medium">Track and manage your project issues</p>
                </div>
            </div>
            <div class="flex gap-8 absolute right-5 top-5">
                <h1 class="flex font-medium items-center gap-2"><span
                        class="bg-[#00A96E] w-5 h-5 flex items-center justify-center rounded-full"></span>Open</h1>
                <h1 class="flex font-medium items-center gap-2"><span
                        class="bg-[#A855F7] w-5 h-5 flex rounded-full"></span> Closed</h1>
            </div>
        </div>
    </section>

    <section id="word-container" class="bg-gray-50 p-10 w-11/12 mx-auto rounded-lg mt-[-10px] mb-10 grid grid-cols-3 gap-4
     ">
    
    </section>

    <script src="script/filter.js"></script>
</body>

</html>
